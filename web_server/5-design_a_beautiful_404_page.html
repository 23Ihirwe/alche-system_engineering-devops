<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0f19;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .error-container {
            max-width: 600px;
            padding: 40px;
        }

        h1 {
            font-size: 120px;
            margin: 0;
        }

        h2 {
            font-size: 32px;
        }

        p {
            font-size: 18px;
            opacity: 0.8;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: white;
            color: #0b0f19;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div class="error-container">
        <h1>404</h1>
        <h2>Oops! This page disappeared.</h2>
        <p>Ceci n'est pas une page</p>
        <p>The page you are looking for could not be found.</p>
        <a href="/">Return Home</a>
    </div>
</body>
</html>
